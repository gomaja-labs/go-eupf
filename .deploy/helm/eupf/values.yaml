---

global:
  imagePullPolicy: IfNotPresent

replicaCount: 1

# Above the default 32-second process shutdown budget; raise with PFCP T1/N1.
terminationGracePeriodSeconds: 40

# See `kubectl explain deployment.spec.strategy` for more
# ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
deploymentStrategy:
  type: RollingUpdate

deploymentType: deployment
# deploymentType: statefulset

image:
  registry: ghcr.io
  repository: gomaja-labs
  name: go-eupf
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Empty by default: falls back to global.imagePullPolicy.
  pullPolicy: ""

# Administration token. Empty generates a random token in a release Secret.
# existingSecret must contain the key api-token.
api:
  token: ""
  existingSecret: ""
  tls:
    # A kubernetes.io/tls Secret containing tls.crt and tls.key.
    existingSecret: ""
    # Optional PEM CA key in the same Secret, used by the CLI sidecar.
    caBundleKey: ""

# Optional management shell, using the published CLI image and the same token.
cli:
  enabled: false
  image: ghcr.io/gomaja-labs/go-eupf-cli:main

# Override default container command
command: []

# Override default container args
args: []

initContainers: []
  # - name: run-db-migrations
  #   # if "" then uses default image for this chart
  #   image: ""
  #   command:
  #     - /bin/sh
  #     - -ec
  #     - |
  #       python3 manage.py migrate
  # - name: run-something
  #   image: ""
  #   command:
  #     - /bin/sh
  #     - -ec
  #     - |
  #       echo "start something"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Default UPF_* environment variables. Injected only when config.enabled=false
# (ENV mode). Individual entries can be overridden via `env` below or your own
# values file; eUPF also falls back to built-in defaults for anything unset.
defaultEnv:
  UPF_INTERFACE_NAME: eth0
  # The eBPF maps are sized from max_sessions (two PDR, FAR and URR entries
  # and one QER entry per session). eUPF's own default is 65535 sessions, whose
  # maps need more memory than the chart's default limit below; 1024 keeps the
  # maps at the size the limit was set for. Raise both together for production.
  # Shared admission limit, including empty and retiring session contexts.
  UPF_MAX_SESSIONS: "1024"
  UPF_PFCP_REPLAY_MEMORY_MIB: "96"
  UPF_BUFFER_PACKETS: "4096"
  UPF_BUFFER_PER_SESSION: "4"
  UPF_BUFFER_RETENTION_SECONDS: "30"
  # Session restoration period; only automatic UE IPv4 allocation waits.
  # Zero permits immediate reuse of unrestored predecessor UE IPv4 addresses.
  UPF_RESTORATION_PERIOD: "60"
  # Local inactivity release in seconds (independent of the CP timer); zero disables.
  UPF_INACTIVITY_RELEASE_TIMEOUT: "0"
  UPF_API_ADDRESS: ":8080"
  UPF_PFCP_ADDRESS: ":8805"
  UPF_METRICS_ADDRESS: ":9090"
  UPF_PFCP_NODE_ID: $(MY_POD_IP)
  UPF_N3_ADDRESS: $(MY_POD_IP)

# Additional environment variables (merged on top of defaultEnv).
env: {}
  # UPF_INTERFACE_NAME: eth0,n6
  # UPF_LOGGING_LEVEL: debug

# eUPF configuration source.
# enabled=false (default): configure via UPF_* environment variables
# (the chart injects a working default set, see helpers/_pod.tpl).
# enabled=true: create a ConfigMap from config.data, mount it at config.mountPath
# and run the container with `--config <config.path>`. In this mode the default
# UPF_* env injection is disabled because environment variables take precedence
# over the config file in eUPF.
config:
  enabled: false
  path: /app/conf/config.yml
  mountPath: /app/conf
  data: {}
    # config.yml: |
    #   interface_name: eth0
    #   max_sessions: 1024
    #   pfcp_replay_memory_mib: 96
    #   buffer_packets: 4096
    #   buffer_per_session: 4
    #   buffer_retention_seconds: 30
    #   # Holds automatic UE IPv4 allocation and suppresses unknown-tunnel Error Indications.
    #   restoration_period: 60
    #   inactivity_release_timeout: 0
    #   api_address: :8080
    #   pfcp_address: :8805
    #   metrics_address: :9090

# create config maps
configMaps: {}
  # config:
  #   additionalLabels:
  #     foo: bar
  #   additionalAnnotations:
  #     foo: bar
  #   data:
  #     config.yml: |
  #       foo: bar

# Additional volumes and mounts; eUPF needs no host filesystem mounts.
volumes: []
volumeMounts: []

hostNetwork: false

xdpProgrammInstall:
  enabled: false
  securityContext:
    capabilities:
      add:
        - NET_ADMIN
        - BPF
    privileged: true
    runAsNonRoot: false
  env:
    - name: POD_N6_IP
      value: 10.100.100.12
  command:
    - /bin/sh
    - -c
    - |
      apk add iproute2; \
      echo "starting"; \
      i=0; IFACE_NAME=""; \
      while [ -z "$IFACE_NAME" ]; \
      do \
        echo "check $i: searching interface name"; sleep 1; \
        IFACE_NAME=$(ip route list ${POD_N6_IP} | awk '{print $3}'); \
        i=$((i+1)); \
      done ;\
      echo "done: current interface name is ${IFACE_NAME}" ;\
      set -x ;\
      ls -alh /app ;\
      ip link set dev ${IFACE_NAME} xdpdrv obj /app/zeroentrypoint_bpf.o sec xdp/upf_zero_entrypoint

bird:
  enabled: false
  image: docker.io/edgecom/bird:0.0.4
  env:
    BIRD_ROUTER_ID: $(MY_POD_IP)
    BIRD_LOCAL_AS: 65000
    BIRD_LOCAL_PREFIX: 10.45.0.0/16
    BIRD_NEIGHBOR_IP: $(MY_NODE_IP)
    BIRD_NEIGHBOR_AS: 64512
  service:
    enabled: false
    type: ClusterIP
    port: 179
  ports:
    - name: bgp
      containerPort: 179
      protocol: TCP
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  livenessProbe:
    tcpSocket:
      port: bgp
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: bgp
    initialDelaySeconds: 5
    periodSeconds: 10

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

metrics:
  enabled: false
  serviceMonitor:
    # Create ServiceMonitor Resource for scraping metrics using Prometheus Operator
    enabled: false
    # Namespace for the ServiceMonitor Resource (defaults to the Release Namespace)
    namespace: ""
    # Interval at which metrics should be scraped.
    # ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    interval: ""
    # Timeout after which the scrape is ended
    # ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    scrapeTimeout: ""
    # Additional labels that can be used so ServiceMonitor will be discovered by Prometheus
    labels: {}
    # Prometheus instance selector labels
    # ref: https://github.com/bitnami/charts/tree/main/bitnami/prometheus-operator#prometheus-configuration
    selector: {}
    # RelabelConfigs to apply to samples before scraping
    relabelings: []
    # MetricRelabelConfigs to apply to samples before ingestion
    metricRelabelings: []
    # Specify honorLabels parameter to add the scrape endpoint
    honorLabels: false
    # The name of the label on the target service to use as the job name in prometheus.
    jobLabel: ""
    endpoints:
      port: metrics
      path: "/metrics"

podAnnotations: {}

podSecurityContext:
  # net.ipv4.ip_forward is an unsafe sysctl: nodes must allow it via
  # kubelet --allowed-unsafe-sysctls=net.ipv4.ip_forward
  sysctls:
    - name: net.ipv4.ip_forward
      value: "1"

# eUPF loads eBPF programs (BPF, PERFMON), attaches XDP and sets routes
# (NET_ADMIN), raises RLIMIT_MEMLOCK (SYS_RESOURCE), and sends raw Ethernet
# frames for downlink buffering continuation (NET_RAW). The binary carries
# exactly these file capabilities; all must be in the container bounding set
# or exec fails with EPERM. No filesystem mounts or SYS_ADMIN are needed.
# The container retains the runtime's seccomp and AppArmor profiles.
#   capabilities:
#     drop: [ALL]
#     add: [NET_ADMIN, NET_RAW, SYS_RESOURCE, BPF, PERFMON]
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
    add: [NET_ADMIN, NET_RAW, SYS_RESOURCE, BPF, PERFMON]

extraContainerPorts:
  - name: metrics
    containerPort: 9090
    protocol: TCP

service:
  type: ClusterIP
  # Must match the eUPF API address (UPF_API_ADDRESS / api_address), default :8080.
  port: 8080
  extraPorts:
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Memory floor: 2 * 96 MiB replay + B + 32 KiB * max_sessions
# + 3 * (16 MiB + R) originated queues + 32 MiB transient + H + K + W.
# B=max(64 MiB, observed loaded cgroup charge + growing-map reserve);
# it includes empty buffering maps and the fixed 4 MiB packet ring.
# P=buffer_packets, N=max_sessions, F=far_map_size (default 2*N),
# U=urr_map_size (default 2*N), V=F+min(F,128), J=U+min(U,128).
# V and J include replacement versions; all H/K/W terms are bytes:
# H=2*131072 + P*(2048+2*160) + 2*1024*N + 2*320*(2*V) + 2*4608*V.
# K=11 MiB + 320*N + 1152*(2*V) + 4608*P; growing kernel metadata stays outside Go's limit.
# R=max(16 MiB, 2048*(U+128)); a single session can own every URR.
# W=768*J, from sparse URR-map measurement-window profiles plus GC headroom.
# Defaults: R=16 MiB, H=33.28125 MiB, K=34.09375 MiB, W=1.59375 MiB; floor=484.96875 MiB.
# Packet storage is taken on arrival; every admitted session can use BUFF/NOCP.
# A larger measured B raises this floor. The chart's 96 MiB replay budget is
# smaller than the standalone 128 MiB default; large replies fill it sooner.
# These are startup accounting reserves. Full buffers, forwarding/rule load,
# cgroup charge and CPU consumption still require workload-specific checks.
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

startupProbe: {}
  # We usually recommend to specify probes, read https://habr.com/ru/company/nixys/blog/544288/
  # httpGet:
  #   path: /healthz
  #   port: http
  # failureThreshold: 30
  # periodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}

# Array of extra objects to deploy with the release
extraDeploy: []
