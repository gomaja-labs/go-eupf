{{- if not .Values.api.existingSecret }}
{{- $name := include "eupf.apiSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := .Values.api.token }}
{{- if and (not $token) $existing }}
{{- $token = index $existing.data "api-token" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "eupf.labels" . | nindent 4 }}
type: Opaque
data:
  api-token: {{ $token | default (randAlphaNum 48) | b64enc | quote }}
{{- end }}
