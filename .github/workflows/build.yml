name: images

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build both images
        run: |
          docker build -t eupf:scan .
          docker build --target cli -t eupf-cli:scan .
      - name: Check non-root runtime readiness
        env:
          EUPF_RUNTIME_SMOKE_USER: '1000:1000'
        run: scripts/ci/runtime-readiness.sh eupf:scan
      - name: Scan filesystem
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src aquasec/trivy:0.76.2 fs --config trivy.yaml --ignorefile .trivyignore .
      - name: Scan configuration
        if: success() || failure()
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src aquasec/trivy:0.76.2 config --config trivy.yaml --ignorefile .trivyignore .
      - name: Scan both images
        if: success() || failure()
        run: |
          failed=0
          for image in eupf:scan eupf-cli:scan; do
            docker save "$image" -o image.tar
            docker run --rm -v "$PWD:/src:ro" -w /src aquasec/trivy:0.76.2 image --config trivy.yaml --ignorefile .trivyignore --input image.tar || failed=1
            rm image.tar
          done
          exit "$failed"
      - name: Save scanned images
        if: github.event_name == 'push'
        run: docker save eupf:scan eupf-cli:scan | gzip > images.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'push'
        with:
          name: images-${{ matrix.arch }}
          path: images.tar.gz
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: images-*
      - name: Publish on main and tags
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          repository="${REPOSITORY,,}"
          # Publish the saved, scanned images; never rebuild after testing.
          for arch in amd64 arm64; do
            gunzip -c "images-$arch/images.tar.gz" | docker load
            for suffix in '' '-cli'; do
              docker tag "eupf$suffix:scan" "ghcr.io/$repository$suffix:$GITHUB_SHA-$arch"
              docker push "ghcr.io/$repository$suffix:$GITHUB_SHA-$arch"
            done
          done
          for suffix in '' '-cli'; do
            docker buildx imagetools create \
              --tag "ghcr.io/$repository$suffix:$REF_NAME" \
              --tag "ghcr.io/$repository$suffix:$GITHUB_SHA" \
              "ghcr.io/$repository$suffix:$GITHUB_SHA-amd64" \
              "ghcr.io/$repository$suffix:$GITHUB_SHA-arm64"
          done
          docker logout ghcr.io
