---

global:
  imagePullPolicy: Always

deploymentStrategy:
  type: Recreate

image:
  tag: main


env:
  UPF_PFCP_NODE_ID: $(MY_POD_IP)
  UPF_N3_ADDRESS: $(MY_POD_IP)

config:
  enabled: true
  data:
    config.yml: |
      max_sessions: 1024
      pfcp_replay_memory_mib: 96
      interface_name: eth0
      api_address: :8080
      pfcp_address: :8805
      metrics_address: :9090

bird:
  enabled: true
  env:
    BIRD_LOCAL_AS: 65001
    BIRD_LOCAL_PREFIX: 10.11.0.0/16

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
    endpoints:
      port: metrics
      path: "/metrics"

podAnnotations:
  cni.projectcalico.org/ipv4pools: '["default-pool"]'
  cni.projectcalico.org/ipAddrs: '["10.233.64.11"]'

podSecurityContext:
  sysctls:
  - name: net.ipv4.ip_forward
    value: "1"

securityContext:
  privileged: true

extraContainerPorts:
  - name: metrics
    containerPort: 9090
    protocol: TCP
  - name: gtpu
    containerPort: 2152
    protocol: UDP
  - name: pfcp
    containerPort: 8805
    protocol: UDP

service:
  type: ClusterIP
  port: 8080
  extraPorts:
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
    - port: 2152
      targetPort: gtpu
      protocol: UDP
      name: gtpu
    - port: 8805
      targetPort: pfcp
      protocol: UDP
      name: pfcp

# Use the chart's sized resource defaults.

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
